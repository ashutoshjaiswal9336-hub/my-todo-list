<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My To Do List</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#eef2f6;--cd:#fff;--tx:#17212f;--mu:#667389;--pr:#0f766e;--on:#fff;--bd:#d6dde8;--ok:#16a34a;--am:#f59e0b;--bad:#dc2626}
[data-theme=dark]{--bg:#0e141c;--cd:#18212d;--tx:#e6ebf3;--mu:#93a0b4;--pr:#2dd4bf;--on:#06201c;--bd:#2a3646;--ok:#22c55e;--am:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);line-height:1.4}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:96px}
button,input,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;margin:12px 14px;padding:8px 10px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;position:sticky;top:8px;z-index:10}
#logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--pr);flex:none}
.brand{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.brand b{font-size:1rem;white-space:nowrap}
.sq{width:34px;height:24px;border:1.5px solid var(--bd);border-radius:6px;background:none;cursor:pointer;line-height:1;font-size:.95rem}
.sp{flex:1}
.pill{height:28px;padding:0 10px;border-radius:14px;border:0;background:var(--bg);color:var(--pr);font-weight:700;font-size:.72rem;cursor:pointer}
.ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);cursor:pointer;font-weight:700;flex:none}
.av{background:var(--am) center/cover no-repeat;color:#222;border:0;display:flex;align-items:center;justify-content:center;font-weight:700}
main{padding:0 14px}
.pg{display:none}.pg.on{display:block}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
small,.mu{color:var(--mu)}
h2{margin:4px 0 10px;font-size:1.15rem}h3{margin:2px 0 8px}
.hl{display:flex;justify-content:space-between;align-items:center;gap:8px}
#hbig{margin:2px 0;font-size:1.5rem}
.prc{color:var(--pr);font-weight:700;font-size:.85rem;margin:0}
.ring{width:84px;height:84px;flex:none}
.rb{fill:none;stroke:var(--bd);stroke-width:7}
.rf{fill:none;stroke:var(--ok);stroke-width:7;stroke-linecap:round;stroke-dasharray:213.6;transition:stroke-dashoffset .5s}
.ring text{fill:var(--tx);font-weight:700;font-size:15px}
input,textarea{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:0}
#dt{width:auto;margin-top:6px;padding:5px 8px;font-size:.8rem}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.wk button{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--mu);font-weight:700}
.wk b{font-size:1rem;color:var(--tx)}
.wk .on{background:var(--pr);border-color:var(--pr)}.wk .on,.wk .on b{color:var(--on)}
.wk .td{box-shadow:inset 0 -3px 0 var(--am)}
.btn{background:var(--pr);color:var(--on);border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}
.btn.g{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--bad);color:#fff}
.dash{width:100%;background:none;border:1.5px dashed var(--pr);color:var(--pr);border-radius:12px;padding:9px;font-weight:700;cursor:pointer;margin-bottom:10px}
.tk{display:grid;grid-template-columns:28px 1fr 64px;gap:6px 10px;align-items:center;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.tk input{border:0;background:transparent;padding:5px 6px}
.tk .th{background:var(--bg);border-radius:10px;text-align:center;color:var(--pr);font-weight:700}
.tk .tn{grid-column:2/4;font-size:.82rem;color:var(--mu);border-top:1px dashed var(--bd);border-radius:0}
.tk.dn .tt{color:var(--mu);text-decoration:line-through}
.tk.ro{grid-template-columns:28px 1fr auto}.tk.ro small{grid-column:2/4}
.cb input{display:none}
.cb span,.cbx{display:flex;width:26px;height:26px;border:2px solid var(--mu);border-radius:7px;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
.cbx{cursor:default;color:#fff;font-weight:700}.ro.dn .cbx{background:var(--ok);border-color:var(--ok)}
.cb svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.cb input:checked+span{background:var(--ok);border-color:var(--ok)}
.cb input:checked+span svg{animation:dr .5s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.tabs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}
.tabs button{border:1px solid var(--bd);background:var(--cd);border-radius:20px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:.82rem}
.tabs .on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st .card{margin:0;padding:10px 12px}.st b{font-size:1.25rem;display:block}
.cv{height:210px;position:relative}
#hm{display:grid;grid-template-columns:repeat(16,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px}
#hm i{aspect-ratio:1;border-radius:3px}
.bdg{display:inline-block;margin:6px 6px 0 0;padding:4px 10px;border-radius:12px;background:var(--bg);color:var(--mu);font-size:.78rem;font-weight:700;opacity:.6}
.bdg.on{background:var(--am);color:#222;opacity:1}
.ng{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.add,.nc{aspect-ratio:1;border-radius:16px;padding:12px;overflow:hidden;cursor:pointer}
.add{border:2px dashed var(--pr);color:var(--pr);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:3rem;font-weight:700;background:none}
.add small{font-size:.8rem;color:var(--pr)}
.nc{color:#1f2937;display:flex;flex-direction:column;justify-content:space-between;font-weight:600;font-size:.88rem;word-break:break-word}
.nc small{color:#4b5563;font-weight:400}
.f{display:flex;flex-direction:column;gap:10px}
.pc{text-align:center}
.big{width:104px;height:104px;border-radius:50%;margin:6px auto;font-size:2.4rem;position:relative}
.cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--pr);color:var(--on);border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:.95rem}
.code{display:inline-block;border:1.5px solid var(--pr);color:var(--pr);border-radius:18px;padding:6px 16px;font-weight:700;letter-spacing:.12em;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:8px;font-weight:700;cursor:pointer;text-align:left}
.row.r{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--bd);background:var(--cd);border-radius:14px;padding:5px 10px;cursor:pointer;font-size:.8rem}
#bn{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:452px;background:var(--cd);border:1px solid var(--bd);border-radius:20px;display:flex;padding:6px;gap:4px;z-index:10}
#bn button{flex:1;border:0;background:none;border-radius:14px;padding:11px 0;font-weight:700;font-size:.78rem;color:var(--mu);cursor:pointer}
#bn .on{background:var(--pr);color:var(--on)}
#ov{position:fixed;inset:0;background:#0007;z-index:20}
#dr{position:fixed;top:0;bottom:0;left:0;width:260px;max-width:80%;background:var(--cd);z-index:21;padding:16px 12px;overflow:auto}
#dr .dh{display:flex;gap:10px;align-items:center;margin-bottom:12px}
#dr .av{width:44px;height:44px;border-radius:50%;flex:none}
#dr a{display:block;padding:11px 12px;border-radius:10px;font-weight:700;cursor:pointer}
#dr a.hi{background:var(--pr);color:var(--on)}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:30;padding:14px}
.mb{background:var(--cd);border-radius:16px;padding:16px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
.mb textarea{height:210px;resize:vertical}
.rw{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90%;text-align:center;font-size:.88rem}
#toast.on{opacity:1}
.clk{width:min(300px,78vw);display:block;margin:6px auto 10px}
.cr{fill:none;stroke:var(--bd);stroke-width:14}
.cf{fill:none;stroke:var(--pr);stroke-width:14;stroke-linecap:round;stroke-dasharray:816.8;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:150px 150px;transition:stroke-dashoffset .25s linear}
.clk text{fill:var(--tx);font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
.tset{display:flex;gap:6px;align-items:center;justify-content:center;margin:8px 0}
.tset input{width:76px;text-align:center;font-size:1.3rem;font-weight:700}
#bn button{padding:11px 0;font-size:.72rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cb input:checked+span svg{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="app">
<header>
  <img id="logo" src="logo.png" alt="" onerror="this.style.opacity=0">
  <div class="brand"><b>My To Do List</b><button class="sq" id="mb" aria-label="Menu">&#9776;</button></div>
  <span class="sp"></span>
  <button class="pill" id="lg2">EN | हि</button>
  <button class="ic" id="th" aria-label="Theme">&#9790;</button>
  <button class="ic av" id="av" aria-label="Profile">+</button>
</header>
<div id="ov" hidden></div>
<aside id="dr" hidden>
  <div class="dh"><div class="av" id="dav"></div><div><b id="dn"></b><br><small id="dc"></small></div></div>
  <a data-p="home" data-i="today"></a><a data-p="prog" data-i="prog"></a><a data-p="notes" data-i="notes"></a><a data-p="tmr" data-i="timer"></a>
  <a data-p="hist" class="hi" data-i="hist"></a><a data-p="prof" data-i="drawprof"></a>
  <a id="dl" data-i="lang"></a><a id="dth" data-i="theme"></a><a id="dbk" data-i="backup"></a>
</aside>
<main>
<section id="home" class="pg">
  <div class="card"><div class="hl"><div>
    <small id="hdate"></small><h1 id="hbig"></h1><p class="prc" id="hs1"></p><small id="hs2"></small><br>
    <input type="date" id="dt"></div>
    <svg class="ring" viewBox="0 0 84 84"><circle class="rb" cx="42" cy="42" r="34"/><circle class="rf" id="rf" cx="42" cy="42" r="34" transform="rotate(-90 42 42)"/><text id="rt" x="42" y="48" text-anchor="middle"></text></svg>
  </div></div>
  <div class="wk" id="wk"></div>
  <button class="dash" id="kal" data-i="kal"></button>
  <div id="tl"></div>
</section>

<section id="prog" class="pg">
  <div class="tabs" id="tabs"><button data-r="day" data-i="day"></button><button data-r="week" data-i="week" class="on"></button><button data-r="month" data-i="month"></button><button data-r="year" data-i="year"></button></div>
  <div class="st" id="stc"></div>
  <div class="card"><b data-i="comp2"></b><div class="cv"><canvas id="c1"></canvas></div></div>
  <div class="card"><b data-i="heat"></b><div id="hm" style="margin-top:8px"></div><div id="bdg"></div></div>
  <div class="card"><b data-i="hrs2"></b><div class="cv"><canvas id="c2"></canvas></div></div>
</section>

<section id="notes" class="pg">
  <input id="ns" data-ph="search" style="border-radius:20px;margin-bottom:12px">
  <div class="ng" id="ng"></div>
</section>

<section id="hist" class="pg">
  <h2 data-i="history2"></h2>
  <div class="card"><div style="display:flex;gap:8px"><input type="date" id="hd"><button class="btn" id="hsb" data-i="show"></button></div>
  <small data-i="recent"></small><div class="chips" id="hc"></div></div>
  <div id="hv"></div>
  <div class="card"><b data-i="graph30"></b><div class="cv"><canvas id="c3"></canvas></div></div>
</section>

<section id="tmr" class="pg">
  <div class="tabs" id="tmodes" style="justify-content:center"><button data-m="down" class="on" data-i="countdown"></button><button data-m="up" data-i="stopw"></button></div>
  <div class="card" style="text-align:center">
    <svg class="clk" viewBox="0 0 300 300"><circle class="cr" cx="150" cy="150" r="130"/><g id="tticks" stroke="var(--mu)" stroke-width="3" stroke-linecap="round"></g><circle class="cf" id="tring" cx="150" cy="150" r="130"/><text id="tdisp" x="150" y="166" text-anchor="middle"></text></svg>
    <div class="tset" id="tset"><input id="tsh" type="number" min="0" max="23" inputmode="numeric" data-ph="ph_hh"><b>:</b><input id="tsm" type="number" min="0" max="59" value="25" inputmode="numeric" data-ph="ph_mm"><b>:</b><input id="tss" type="number" min="0" max="59" inputmode="numeric" data-ph="ph_ss"></div>
    <div class="chips" id="tpre" style="justify-content:center"><button class="chip" data-s="300">5m</button><button class="chip" data-s="900">15m</button><button class="chip" data-s="1500">25m</button><button class="chip" data-s="2700">45m</button><button class="chip" data-s="3600">60m</button></div>
    <div class="rw" style="justify-content:center;margin-top:12px"><button class="btn" id="tgo"></button><button class="btn g" id="trs" data-i="reset"></button></div>
  </div>
</section>

<section id="prof" class="pg">
  <div id="pOut" class="f">
    <div class="card f" id="cr">
      <h2 data-i="create"></h2>
      <input id="pn" data-ph="name"><input id="pm" data-ph="mobile" inputmode="numeric" maxlength="10">
      <input id="pp" type="password" data-ph="pass"><input id="pp2" type="password" data-ph="pass2">
      <input id="psa" data-ph="ans"><small data-i="consent"></small>
      <button class="btn" id="mk" data-i="create"></button>
    </div>
    <div class="card f"><h2 data-i="havecode"></h2>
      <input id="lm" data-ph="mobile" inputmode="numeric" maxlength="10"><input id="lw" type="password" data-ph="pwd">
      <button class="btn" id="lp" data-i="login"></button>
      <a id="fp" class="mu" style="cursor:pointer;text-align:center;text-decoration:underline" data-i="forgot"></a>
      <div id="fpb" class="f" hidden>
        <input id="fm" data-ph="mobile" inputmode="numeric" maxlength="10"><input id="fa" data-ph="ans"><input id="fn" type="password" data-ph="newpass">
        <button class="btn" id="fr" data-i="resetans"></button><button class="btn g" id="fq" data-i="askowner"></button>
      </div>
      <small data-i="orcode"></small>
      <input id="lc" data-ph="codeph"><button class="btn g" id="lg" data-i="open"></button></div>
  </div>
  <div id="pIn" hidden>
    <div class="pc"><div class="big av" id="bigav"><label class="cam">&#128247;<input type="file" id="pf" accept="image/*" hidden></label></div>
      <b id="un" style="font-size:1.2rem"></b><br><small id="um"></small><br>
      <small data-i="yourcode"></small><br><span class="code" id="uc"></span><br>
      <button class="btn g" id="cp" data-i="copy"></button></div>
    <div class="card f" style="margin-top:14px"><b data-i="setans"></b><input id="psa2" data-ph="ans"><button class="btn g" id="sa" data-i="save"></button></div>
    <div>
      <a class="row" data-p="hist"><span data-i="history2"></span><span>&rsaquo;</span></a>
      <a class="row" data-p="prog"><span data-i="report"></span><span>&rsaquo;</span></a>
      <a class="row" data-p="notes"><span data-i="nh"></span><span>&rsaquo;</span></a>
      <a class="row" id="rl"><span data-i="lang"></span><span id="rlv"></span></a>
      <a class="row" id="rth"><span data-i="theme"></span><span>&#9790; / &#9728;</span></a>
      <div class="row" style="cursor:default"><span data-i="backup"></span><span><button class="btn g" id="bx">Excel (CSV)</button> <button class="btn g" id="bj">JSON</button></span></div>
      <a class="row r" id="lo"><span data-i="logout"></span><span>&rsaquo;</span></a>
    </div>
  </div>
</section>
</main>
<nav id="bn"><button data-p="home" data-i="today"></button><button data-p="prog" data-i="prog"></button><button data-p="notes" data-i="notes"></button><button data-p="tmr" data-i="timer"></button><button data-p="prof" data-i="prof"></button></nav>
</div>

<div class="modal" id="md" hidden><div class="mb">
  <textarea id="nt" data-ph="nph"></textarea>
  <div class="rw"><button class="btn r" id="nd" data-i="del" hidden></button><button class="btn g" id="nx" data-i="close"></button><button class="btn" id="nsv" data-i="save"></button></div>
</div></div>
<div class="modal" id="adm" hidden><div class="mb" id="admb"></div></div>
<div id="toast"></div>

const K=p=>'mtd/'+p,lget=p=>JSON.parse(localStorage.getItem(K(p))||'null'),lset=(p,d)=>localStorage.setItem(K(p),JSON.stringify(d));
const tmo=(pr,ms=5000)=>Promise.race([pr,new Promise((_,j)=>setTimeout(()=>j('timeout'),ms))]);
const pends=()=>JSON.parse(localStorage.getItem('mtd/pend')||'[]');
const addPend=p=>{const a=pends();if(!a.includes(p)){a.push(p);localStorage.setItem('mtd/pend',JSON.stringify(a))}};
let FB=null;
const FBp=(async()=>{
  if(!CLOUD)return null;
  try{
    const u='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,F]=await tmo(Promise.all([import(u+'firebase-app.js'),import(u+'firebase-firestore.js')]),15000);
    const fs=F.getFirestore(A.initializeApp(CFG)),R=p=>p.split('/');
    FB={get:async p=>{const x=await F.getDoc(F.doc(fs,...R(p)));return x.exists()?x.data():null},
        set:(p,d)=>F.setDoc(F.doc(fs,...R(p)),d),del:p=>F.deleteDoc(F.doc(fs,...R(p))),
        list:async p=>(await F.getDocs(F.collection(fs,...R(p)))).docs.map(x=>({id:x.id,...x.data()})),
        touch:(p,d)=>F.setDoc(F.doc(fs,...R(p)),{...d,n:F.increment(1)},{merge:true})};
    flush();return FB;
  }catch(e){fail(e);return null}
})();
async function flush(){
  const left=[];
  for(const p of pends()){try{const d=lget(p);await tmo(d?FB.set(p,d):FB.del(p))}catch(e){left.push(p)}}
  localStorage.setItem('mtd/pend',JSON.stringify(left));
}
function set(p,d){lset(p,d);if(!CLOUD)return;tmo(FBp,15000).then(fb=>{if(!fb)throw 'nofb';return tmo(fb.set(p,d))}).catch(e=>{fail(e);addPend(p)})}
function del(p){localStorage.removeItem(K(p));if(!CLOUD)return;tmo(FBp,15000).then(fb=>{if(!fb)throw 'nofb';return tmo(fb.del(p))}).catch(e=>{fail(e);addPend(p)})}
function get(p,cb){
  const l=lget(p);
  if(CLOUD)tmo(FBp,15000).then(fb=>fb&&tmo(fb.get(p))).then(d=>{
    if(!d||pends().includes(p))return;
    if(JSON.stringify(d)!==JSON.stringify(l)){lset(p,d);cb&&cb(d)}
  }).catch(fail);
  return l;
}
function llist(p){const pre=K(p)+'/';return Object.keys(localStorage).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes('/')).map(k=>({id:k.slice(pre.length),...JSON.parse(localStorage[k])}))}
async function pull(p){
  if(!CLOUD)return false;
  try{const fb=await tmo(FBp,15000);if(!fb)return false;const pe=pends();
    (await tmo(fb.list(p),10000)).forEach(({id,...d})=>{if(!pe.includes(p+'/'+id))lset(p+'/'+id,d)});return true}
  catch(e){fail(e);return false}
}
async function cloudGet(p){const fb=await tmo(FBp,15000);if(!fb)throw 'nofb';return tmo(fb.get(p),10000)}

let tmode='down',tst='idle',tt0=0,tacc=0,ttot=0,tiv=null,actx=null;
$('#tticks').innerHTML=Array.from({length:12},(_,i)=>`<line x1="150" y1="36" x2="150" y2="${i%3?44:52}" transform="rotate(${i*30} 150 150)"/>`).join('');
const hms=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?pad(h)+':':'')+pad(m)+':'+pad(s%60)};
const tread=()=>((+$('#tsh').value||0)*3600+(+$('#tsm').value||0)*60+(+$('#tss').value||0))*1000;
const tel=()=>tacc+(tst==='run'?Date.now()-tt0:0);
function tstop(){clearInterval(tiv);tiv=null}
function beep(){
  navigator.vibrate?.([300,150,300,150,300]);
  try{if(!actx)return;[0,.4,.8].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.25;o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.25)})}catch(e){}
}
function tdone(){tstop();tst='done';tacc=0;beep();toast(t('t_timeup'));tdraw()}
function tdraw(){
  const e=tel();let txt,fr;
  if(tmode==='down'){
    if(tst==='idle')ttot=tread();
    const rem=tst==='done'?0:Math.max(0,ttot-e);
    txt=hms(Math.ceil(rem/1000));fr=tst==='idle'?1:(ttot?rem/ttot:0);
    if(tst==='run'&&rem<=0)return tdone();
  }else{txt=hms(Math.floor(e/1000));fr=(e%60000)/60000}
  $('#tdisp').textContent=txt;$('#tring').style.strokeDashoffset=816.8*(1-fr);
  $('#tgo').textContent=t(tst==='run'?'pause':(tst==='pause'?'resume':'start'));
}

  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  if(tst==='run'){tacc=tel();tst='pause';tstop()}
  else{
    if(tst==='idle'||tst==='done'){tacc=0;if(tmode==='down'){ttot=tread();if(!ttot)return toast(t('t_settime'))}}
    tt0=Date.now();tst='run';tstop();tiv=setInterval(tdraw,200);
  }
  tdraw();
};
$('#trs').onclick=()=>{tstop();tst='idle';tacc=0;tdraw()};

    if(x.id==='admu'){
      const q=z=>'"'+String(z??'').replace(/"/g,'""')+'"';
      const out='\ufeffcode,name,mobile,created\n'+U.map(w=>[w.id,q(w.name),w.mobile,w.created].join(',')).join('\n');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv;charset=utf-8'}));a.download='users.csv';return a.click();
    }
    if(x.dataset.a){
      try{
        const fb=await tmo(FBp,15000),mo=x.dataset.m;
        if(x.dataset.a==='ok'){
          const us=U.find(z=>z.mobile===mo),r=(await fb.list('resets')).find(z=>z.id===mo);
          if(!us||!r)return toast('Profile not found');
          const {id,...d}=us;await fb.set('users/'+id,{...d,pass:r.pass});toast('Approved');
        }
        await fb.del('resets/'+mo);await draw();
      }catch(er){toast(String(er))}
    }
  };
  try{await draw()}catch(e){b.innerHTML='Error: '+esc(e)+'<br><button class="btn g" id="admx">Close</button>'}
}

/* ---------- Navigation, theme, language ---------- */
const openDr=()=>{$('#ov').hidden=false;$('#dr').hidden=false},closeDr=()=>{$('#ov').hidden=true;$('#dr').hidden=true};
$('#mb').onclick=openDr;$('#ov').onclick=closeDr;
document.addEventListener('click',e=>{const a=e.target.closest('[data-p]');if(a)go(a.dataset.p)});
const setTheme=x=>{document.documentElement.dataset.theme=x;$('#th').innerHTML=x==='dark'?'&#9728;':'&#9790;';localStorage.setItem('mtd_th',x)};
const flip=()=>{setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');go(page,true)};
$('#th').onclick=flip;$('#rth').onclick=flip;$('#dth').onclick=()=>{flip();closeDr()};
function applyLang(){
  document.documentElement.lang=lang;
  $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  $('#rlv').textContent=lang==='hi'?'हिन्दी':'English';
  localStorage.setItem('mtd_lang',lang);
}
const swLang=()=>{lang=lang==='en'?'hi':'en';applyLang();go(page,true)};
$('#lg2').onclick=swLang;$('#rl').onclick=swLang;$('#dl').onclick=()=>{swLang();closeDr()};
function go(p,keep){
  saveNow();
  if(!me&&p!=='prof'){toast(t('t_login'));p='prof'}
  page=p;
  $$('.pg').forEach(e=>e.classList.toggle('on',e.id===p));
  $$('#bn button').forEach(b=>b.classList.toggle('on',b.dataset.p===p||(p==='hist'&&b.dataset.p==='prof')));
  closeDr();if(!keep)scrollTo(0,0);
  if(p==='home')showDay(keep&&cur?cur:today());
  if(p==='prog')drawProg();
  if(p==='notes')loadNotes();
  if(p==='hist')drawHist();
  if(p==='tmr')tdraw();
  if(p==='prof'){$('#pOut').hidden=!!me;$('#pIn').hidden=!me;$('#cr').hidden=!!localStorage.getItem('mtd_made');
    if(me){$('#un').textContent=me.name;$('#um').textContent='+91 '+me.mobile;$('#uc').textContent=code}}
}

/* ---------- Timetable ---------- */
const blank=()=>({rows:Array.from({length:12},()=>({t:'',h:'',n:'',d:false}))});
const filled=r=>r.filter(x=>x.t.trim()||x.d);
function saveNow(){clearTimeout(tm);if(pnd){set(P('days/'+pnd.d),pnd.dd);pnd=null}}
function showDay(d){
  saveNow();cur=d;$('#dt').value=d;
  data=get(P('days/'+d),c=>{if(cur===d&&!pnd){data=c;render()}})||blank();
  render();
}
function hero(){
  const f=filled(data.rows),dn=f.filter(x=>x.d).length,tot=f.length||12,p=Math.round(dn/tot*100);
  const m=allDays(),sk=streakOf(m);
  $('#hbig').textContent=`${dn} / ${tot} ${t('done')}`;
  $('#hs1').textContent=sk?t('sl',sk):'';$('#hs2').textContent=t('left',Math.max(tot-dn,0));
  $('#rf').style.strokeDashoffset=213.6*(1-dn/tot);$('#rt').textContent=p+'%';
}
function render(){
  const loc=lang==='hi'?'hi-IN':'en-IN',dd=new Date(cur+'T00:00');
  $('#hdate').textContent=(cur===today()?t('today')+' - ':'')+dd.toLocaleDateString(loc,{weekday:'short',day:'numeric',month:'short'});
  const mon=addD(cur,-((dd.getDay()+6)%7)),L=lang==='hi'?['सो','मं','बु','गु','शु','श','र']:['M','T','W','T','F','S','S'];
  $('#wk').innerHTML=Array.from({length:7},(_,i)=>{const d=addD(mon,i);return `<button data-d="${d}" class="${d===cur?'on':''} ${d===today()?'td':''}">${L[i]}<b>${+d.slice(8)}</b></button>`}).join('');
  $('#tl').innerHTML=data.rows.map((r,i)=>`<div class="tk${r.d?' dn':''}" data-i="${i}"><label class="cb"><input type="checkbox" ${r.d?'checked':''}><span><svg viewBox="0 0 24 24"><path d="M4 13l5 6L20 5"/></svg></span></label>
<input class="tt" data-k="t" placeholder="${t('ph_t')}" value="${esc(r.t)}"><input class="th" data-k="h" type="number" min="0" step="0.5" placeholder="${t('ph_h')}" value="${esc(r.h)}">
<input class="tn" data-k="n" placeholder="${t('ph_n')}" value="${esc(r.n)}"></div>`).join('');
  hero();
}
$('#tl').oninput=e=>{
  const c=e.target.closest('.tk');if(!c)return;const r=data.rows[c.dataset.i];
  if(e.target.type==='checkbox'){r.d=e.target.checked;c.classList.toggle('dn',r.d)}else r[e.target.dataset.k]=e.target.value;
  pnd={d:cur,dd:data};clearTimeout(tm);tm=setTimeout(saveNow,500);hero();
};
$('#wk').onclick=e=>{const b=e.target.closest('[data-d]');if(b)showDay(b.dataset.d)};
$('#dt').onchange=e=>e.target.value&&showDay(e.target.value);
$('#kal').onclick=()=>{showDay(addD(today(),1));toast(t('t_kal'))};
addEventListener('pagehide',saveNow);

/* ---------- Progress ---------- */
const stat=(m,d)=>{const r=filled(m[d]||[]),dn=r.filter(x=>x.d);return{p:r.length?Math.round(dn.length/r.length*100):0,tot:r.length,dn:dn.length,pl:r.reduce((a,x)=>a+(+x.h||0),0),hr:dn.reduce((a,x)=>a+(+x.h||0),0)}};
const allDays=()=>{const m={};llist(P('days')).forEach(x=>m[x.id]=x.rows||[]);return m};
const live=d=>d>=(me?.created||'0000')&&d<=today();
const range=n=>Array.from({length:n},(_,i)=>addD(today(),i-n+1));
function streakOf(m){let s=0,k=today();if(stat(m,k).p<50)k=addD(k,-1);while(live(k)&&stat(m,k).p>=50){s++;k=addD(k,-1)}return s}
const ch={};
function mk(id,type,labels,sets,opt={}){
  if(!window.Chart)return;ch[id]?.destroy();
  Chart.defaults.color=css('--mu');Chart.defaults.borderColor=css('--bd');
  ch[id]=new Chart($('#'+id),{type,data:{labels,datasets:sets},options:{responsive:true,maintainAspectRatio:false,...opt}});
}
function heat(m){
  const e=new Date();e.setDate(e.getDate()+(7-e.getDay())%7);const end=fmt(e),start=addD(end,-111);let h='';
  for(let i=0;i<112;i++){const d=addD(start,i),s=d>today()?null:stat(m,d).p;
    h+=`<i title="${d}" style="background:${s===null?'transparent':(!live(d)||!s)?'var(--bd)':s>=50?'var(--ok)':'var(--am)'}"></i>`}
  $('#hm').innerHTML=h;
}
function drawProg(nopull){
  const m=allDays(),r=$('#tabs .on').dataset.r;let labels=[],pct=[],hr=[],pl=[],days=[];
  if(r==='day'){
    const f=filled(m[today()]||[]).slice(0,12);days=[today()];
    labels=f.map((x,i)=>x.t.trim()||('Task '+(i+1)));hr=f.map(x=>x.d?(+x.h||0):0);pl=f.map(x=>+x.h||0);
  }else if(r==='week'||r==='month'){
    days=range(r==='week'?7:30);labels=days.map(d=>d.slice(5));
    pct=days.map(d=>live(d)?stat(m,d).p:null);hr=days.map(d=>stat(m,d).hr);pl=days.map(d=>stat(m,d).pl);
  }else{
    const n=new Date();
    for(let i=11;i>=0;i--){
      const d=new Date(n.getFullYear(),n.getMonth()-i,1),ym=fmt(d).slice(0,7),cnt=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      const all=Array.from({length:cnt},(_,j)=>`${ym}-${pad(j+1)}`).filter(live);
      labels.push(d.toLocaleString(lang==='hi'?'hi-IN':'en',{month:'short'}));
      pct.push(all.length?Math.round(all.reduce((a,k)=>a+stat(m,k).p,0)/all.length):null);
      hr.push(all.reduce((a,k)=>a+stat(m,k).hr,0));pl.push(all.reduce((a,k)=>a+stat(m,k).pl,0));days.push(...all);
    }
  }
  const st=days.filter(live).map(d=>stat(m,d)),done=st.reduce((a,x)=>a+x.dn,0),tot=st.reduce((a,x)=>a+x.tot,0);
  const avg=st.length?Math.round(st.reduce((a,x)=>a+x.p,0)/st.length):0,sk=streakOf(m);
  $('#stc').innerHTML=[[t('streak'),sk+' '+t('days')],[t('avg'),avg+'%'],[t('tdone'),done+'/'+tot]].map(x=>`<div class="card"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');
  if(r==='day')mk('c1','doughnut',[t('tdone'),'-'],[{data:[done,Math.max(tot-done,0)],backgroundColor:[css('--ok'),css('--bd')],borderWidth:0}]);
  else mk('c1',r==='month'?'line':'bar',labels,[{label:t('comp2'),data:pct,backgroundColor:css('--pr'),borderColor:css('--pr'),tension:.3,spanGaps:true}],{scales:{y:{min:0,max:100}}});
  mk('c2','bar',labels,[{label:t('planned'),data:pl,backgroundColor:css('--bd')},{label:t('actual'),data:hr,backgroundColor:css('--pr')}]);
  heat(m);$('#bdg').innerHTML=[7,30,100].map(n=>`<span class="bdg ${sk>=n?'on':''}">&#127942; ${n} ${t('days')}</span>`).join('');
  if(!nopull)pull(P('days')).then(ok=>ok&&page==='prog'&&drawProg(true));
}
$('#tabs').onclick=e=>{if(e.target.dataset.r){$$('#tabs button').forEach(b=>b.classList.toggle('on',b===e.target));drawProg(true)}};

/* ---------- Notes ---------- */
let NT=[],eid=null;const COL=['#fde68a','#bbf7d0','#bfdbfe','#fbcfe8','#ddd6fe'];
function loadNotes(nopull){
  NT=llist(P('notes')).sort((a,b)=>b.ts-a.ts);const q=$('#ns').value.toLowerCase();
  $('#ng').innerHTML=`<div class="add" id="addn">+<small>${t('newnote')}</small></div>`+NT.filter(n=>n.x.toLowerCase().includes(q)).map(n=>
    `<div class="nc" data-id="${n.id}" style="background:${COL[(parseInt(n.id.slice(1))||0)%5]}"><span>${esc(n.x.slice(0,120))}</span><small>${new Date(n.ts).toLocaleDateString()}</small></div>`).join('');
  if(!nopull)pull(P('notes')).then(ok=>ok&&page==='notes'&&loadNotes(true));
}
$('#ns').oninput=()=>loadNotes(true);
function openNote(id){eid=id;const n=NT.find(x=>x.id===id);$('#nt').value=n?n.x:'';$('#nd').hidden=!n;$('#md').hidden=false;$('#nt').focus()}
$('#ng').onclick=e=>{if(e.target.closest('#addn'))return openNote(null);const c=e.target.closest('.nc');if(c)openNote(c.dataset.id)};
$('#nsv').onclick=()=>{const x=$('#nt').value.trim();if(!x)return toast(t('t_empty'));set(P('notes/'+(eid||'n'+Date.now())),{x,ts:Date.now()});$('#md').hidden=true;toast(t('t_ns'));loadNotes(true)};
$('#nd').onclick=()=>{if(confirm(t('t_cd'))){del(P('notes/'+eid));$('#md').hidden=true;loadNotes(true)}};
$('#nx').onclick=()=>$('#md').hidden=true;

/* ---------- History ---------- */
function drawHist(nopull){
  const m=allDays(),ks=Object.keys(m).filter(k=>stat(m,k).tot).sort().reverse().slice(0,14),days=range(30);
  $('#hc').innerHTML=ks.map(k=>`<button class="chip" data-d="${k}">${k.slice(5)} <b>${stat(m,k).p}%</b></button>`).join('')||'<small>-</small>';
  mk('c3','bar',days.map(d=>d.slice(5)),[{label:t('comp2'),data:days.map(d=>live(d)?stat(m,d).p:null),backgroundColor:css('--pr')}],{scales:{y:{min:0,max:100}}});
  if(!nopull)pull(P('days')).then(ok=>ok&&page==='hist'&&drawHist(true));
}
async function viewDay(d){
  const p=P('days/'+d);let x=get(p,()=>viewDay(d));
  if(!x&&CLOUD){try{x=await cloudGet(p);if(x)lset(p,x)}catch(e){fail(e)}}
  if(!x)return toast(t('t_nf'));
  $('#hv').innerHTML=`<div class="card"><h3>${d}</h3>`+filled(x.rows).map(r=>`<div class="tk ro${r.d?' dn':''}"><span class="cbx">${r.d?'&#10003;':''}</span><span>${esc(r.t)}</span><b class="mu">${esc(r.h)}${r.h?'h':''}</b>${r.n?`<small>${esc(r.n)}</small>`:''}</div>`).join('')+'</div>';
}
$('#hsb').onclick=()=>{const d=$('#hd').value;if(!d)return toast(t('t_nodate'));viewDay(d)};
$('#hc').onclick=e=>{const b=e.target.closest('[data-d]');if(b){$('#hd').value=b.dataset.d;viewDay(b.dataset.d)}};

/* ---------- Backup ---------- */
async function backup(kind){
  await Promise.all([pull(P('days')),pull(P('notes'))]);
  const days=llist(P('days')).sort((a,b)=>a.id<b.id?-1:1),nts=llist(P('notes'));let out,name;
  if(kind==='json'){const{pass,photo,...u}=me;out=JSON.stringify({profile:u,code,days,notes:nts},null,1);name='my-todo-backup.json'}
  else{const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
    out='\ufeffdate,task,hours,notes,done\n'+days.flatMap(d=>filled(d.rows).map(r=>[d.id,q(r.t),r.h,q(r.n),r.d?'yes':'no'].join(','))).join('\n');name='my-todo-backup.csv'}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();
}
$('#bx').onclick=()=>backup('csv');$('#bj').onclick=()=>backup('json');$('#dbk').onclick=()=>{closeDr();backup('csv')};

/* ---------- Start ---------- */
setTheme(localStorage.getItem('mtd_th')||'light');
applyLang();loadMe();go(me?'home':'prof');
if(location.search.includes('admin'))admin();else trackVisit();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
